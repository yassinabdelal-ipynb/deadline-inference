[build-system]
requires = ["setuptools>=78.1"]
build-backend = "setuptools.build_meta"

[project]
name = "deadline-inference"
version = "0.3.1"
description = "Native desktop lab for reproducible inference scheduling experiments"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = ["torch==2.12.0", "torchvision==0.27.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3.14",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]

[project.scripts]
deadline-inference = "deadline_engine.__main__:main"

[project.gui-scripts]
deadline-inference-desktop = "deadline_engine.desktop:main"

[tool.setuptools]
packages = ["deadline_engine"]
