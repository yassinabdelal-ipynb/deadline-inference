name: Build desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows-cpu:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          allow-prereleases: false
      - name: Verify version tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag and package version must match'
      - name: Install isolated CPU build dependencies
        run: |
          python scripts/bootstrap.py --backend cpu --environment .build-venv
          .\.build-venv\Scripts\python.exe -m pip install -r requirements-build.txt
      - name: Bounded reference tests
        env:
          RUN_MODEL_TESTS: '0'
          RUN_GPU_TESTS: '0'
        run: .\.build-venv\Scripts\python.exe -m unittest discover -s tests -v
      - name: Inspect source and build desktop plus source ZIP
        run: |
          .\.build-venv\Scripts\python.exe scripts/check_release.py --source
          .\.build-venv\Scripts\python.exe scripts/build_release.py
      - name: Explicit checkpoint download for extracted binary test
        env:
          DEADLINE_ENGINE_DATA_DIR: ${{ github.workspace }}\.cache\release-test
        run: .\.build-venv\Scripts\python.exe -m deadline_engine fetch-weights
      - name: Check archives and test extracted desktop
        env:
          DEADLINE_ENGINE_DATA_DIR: ${{ github.workspace }}\.cache\release-test
        run: |
          .\.build-venv\Scripts\python.exe scripts/check_release.py --archives --output results/release-check.json
          .\.build-venv\Scripts\python.exe scripts/verify_release.py --smoke --output results/release-verification.json
      - name: Retain downloadable archives
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: deadline-inference-release
          path: |
            dist/DeadlineInference-Windows-x64-CPU.zip
            dist/deadline-inference-source.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows-cpu
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified build artifacts with GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$env:RUN_ID" --name deadline-inference-release --dir release
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          @'
          Native Windows x64 desktop application. Extract the entire CPU ZIP and open DeadlineInference.exe. No Python, account, API key, or NVIDIA GPU is required for the CPU application.

          The executable is unsigned and CPU-only. NVIDIA CUDA execution uses the source installation with a compatible NVIDIA driver. Model weights are downloaded explicitly by Fetch model and then cached. Synthetic-image experiments measure execution and scheduling, not prediction accuracy.

          Source setup and OS support boundaries are documented in docs/PORTABILITY.md. SHA256SUMS.txt checks download integrity; it is not a code signature.
          '@ | Set-Content -LiteralPath release-notes.md -Encoding utf8
          gh release create "$env:RELEASE_TAG" release/DeadlineInference-Windows-x64-CPU.zip release/deadline-inference-source.zip release/SHA256SUMS.txt --verify-tag --title "Deadline Inference $env:RELEASE_TAG" --notes-file release-notes.md

# workflow_dispatch builds artifacts without publishing. Pushing a version tag
# publishes only after tests, archive checks and the extracted native app pass.
# github.token is generated by GitHub; maintainers add no API keys or secrets.
