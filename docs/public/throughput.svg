<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="690" viewBox="0 0 1040 690" role="img" aria-labelledby="title desc">
<title id="title">Measured image inference throughput</title><desc id="desc">Batch one and batch four images per second for four classifiers on CPU and CUDA; 10 samples per batch.</desc>
